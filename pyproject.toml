[project]
name = "sba-928"
version = "0.1.0"
description = "SBA 928 Market Research AI Pipeline: Curated prompt variations, DistilBERT fine-tuning comparison, and bias/fairness auditing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.2.0",
    "langchain-groq>=1.2.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[project.scripts]
sba-928 = "sba_928:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
